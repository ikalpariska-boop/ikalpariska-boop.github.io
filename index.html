<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ikal Kila — Illustrator &amp; Art Student</title>
<meta name="description" content="Illustration portfolio of Haikal Aqila — finished work alongside the sketches and process behind each piece.">
<meta name="theme-color" content="#F7F6F2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23F7F6F2'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' text-anchor='middle' fill='%2325344A'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body x-data="site">

<a href="#main" class="skip-link">Skip to work</a>
<div class="grain" aria-hidden="true"></div>

<!-- ═══════════════ NAV ═══════════════ -->
<div @click.outside="closeMenu">
  <nav class="site-nav" :class="{ 'is-scrolled': scrolled }">
    <div class="container">
      <a href="index.html" class="wordmark" x-text="name || 'Haikal Aqila'"></a>
      <div class="nav-links">
        <a href="index.html" class="nav-link is-active">Work</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="about.html#contact" class="nav-link">Contact</a>
      </div>
      <button type="button" class="nav-ham" @click="toggleMenu" :aria-expanded="menuOpen" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="mobile-menu" x-show="menuOpen" x-cloak x-transition.opacity>
    <a href="index.html" class="nav-link is-active" @click="closeMenu">Work</a>
    <a href="about.html" class="nav-link" @click="closeMenu">About</a>
    <a href="about.html#contact" class="nav-link" @click="closeMenu">Contact</a>
  </div>
</div>

<main id="main" style="padding-top: 64px">

  <!-- Editorial hero header -->
  <div class="container" style="padding-top: 88px; padding-bottom: 48px; border-bottom: 1px solid var(--border)">
    <div class="hero-intro">
      <div>
        <h1 class="hero-name reveal">Ikal<br>Kila</h1>
        <p class="eyebrow reveal" style="margin-top: 22px; animation-delay: 90ms" x-text="[tagline, location].filter(Boolean).join(' — ')"></p>
      </div>
      <div class="reveal" style="text-align: right; padding-bottom: 6px; flex-shrink: 0; animation-delay: 160ms">
        <p class="eyebrow" style="line-height: 2.1" x-text="availability"></p>
        <a :href="'mailto:' + email" class="text-link" style="text-transform: uppercase; letter-spacing: 0.09em; border-bottom: 1px solid var(--accent); color: var(--accent); padding-bottom: 1px" x-text="email"></a>
      </div>
    </div>
  </div>

  <!-- Artwork gallery grid -->
  <div class="container" style="padding-top: 40px; padding-bottom: 96px" x-data="gallery">
    <p class="eyebrow" x-show="loading" x-cloak aria-live="polite">Loading work…</p>
    <p class="eyebrow" x-show="error" x-cloak aria-live="polite">Couldn&rsquo;t load the gallery right now — try refreshing.</p>
    <p class="eyebrow" x-show="!loading && !error && projects.length === 0" x-cloak aria-live="polite">No work posted yet — check back soon.</p>

    <div class="gallery-cols">
      <template x-for="project in projects" :key="project.id">
        <a :href="`project.html?id=${project.id}`" class="gallery-card reveal">
          <div class="art-slot" :class="project.arClass" :data-tint="project.tint" data-label="artwork">
            <div class="art-cover">
              <img class="art-img" :src="project.coverImage" :alt="project.coverAlt" loading="lazy" @error="$el.classList.add('art-img--missing')">
            </div>
            <div class="art-process">
              <img class="art-img" :src="project.processImage" :alt="`${project.title} — process`" loading="lazy" @error="$el.classList.add('art-img--missing')">
            </div>
          </div>
          <div class="gallery-card-meta">
            <div>
              <p class="card-title" style="margin-bottom: 5px" x-text="project.title"></p>
              <p class="eyebrow" x-text="project.category"></p>
            </div>
            <p class="eyebrow" style="white-space: nowrap; margin-top: 2px" x-text="project.year"></p>
          </div>
        </a>
      </template>
    </div>
  </div>

</main>

<!-- ═══════════════ FOOTER ═══════════════ -->
<footer class="site-footer">
  <div class="container">
    <p class="footer-copy">© <span x-text="new Date().getFullYear()"></span> <span x-text="name || 'Haikal Aqila'"></span></p>
    <div class="social-row">
      <a :href="instagram" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="social-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
      </a>
      <a :href="behance" target="_blank" rel="noopener noreferrer" aria-label="Behance" class="social-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M22 7h-7V5h7v2zm1.726 10c-.442 1.297-2.029 3-5.101 3-3.074 0-5.564-1.729-5.564-5.675 0-3.91 2.325-5.92 5.466-5.92 3.082 0 4.964 1.782 5.375 4.426.078.506.109 1.188.095 2.14H15.97c.13 3.211 3.483 3.312 4.588 2.029H23.72zm-7.726-3h3.608c-.088-1.74-1.236-2.484-1.892-2.484-.765 0-1.56.527-1.716 2.484zM8 11.979c1.888 0 2.879-.954 2.879-2.248 0-1.283-.991-1.964-2.879-1.964H3.78v4.212H8zm.279 5.021c2.104 0 3.201-1.028 3.201-2.56 0-1.432-1.098-2.44-3.201-2.44H3.78V17H8.28z"></path></svg>
      </a>
    </div>
  </div>
</footer>

<script defer src="js/site.js"></script>
<script defer src="js/gallery.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</body>
</html>
